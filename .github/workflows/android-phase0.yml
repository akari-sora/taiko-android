name: Android Phase 0 diagnostics
on:
  push:
    paths: ["dm/android/**", "dm/platform/android/**", "dm/verify/android/**", ".github/workflows/android-phase0.yml"]
  pull_request:
    paths: ["dm/android/**", "dm/platform/android/**", "dm/verify/android/**", ".github/workflows/android-phase0.yml"]
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dm/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew assembleDebug lintDebug testDebugUnitTest
      - run: python -m unittest discover -s dm/verify/android/tests -v
        working-directory: .
      - uses: actions/upload-artifact@v4
        with:
          name: arm64-phase0-diagnostic-apk
          path: dm/android/app/build/outputs/apk/debug/*.apk
